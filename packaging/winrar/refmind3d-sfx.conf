; WinRAR SFX configuration for RefMind3D offline release.
; Build script passes this file to WinRAR with: rar a -r -sfx -zrefmind3d-sfx.conf ...

Setup=installer\RefMind3D_Offline_Setup.exe
Path=RefMind3D_Offline_Payload
Silent=0
Overwrite=1
Title=RefMind3D Offline Installer
Text
Choose a folder with enough free space, preferably on D: or another non-system drive.
The offline package will be extracted there first, then the graphical installer will start.
In the graphical installer, choose the final RefMind3D install folder; local AI models will be installed under that folder, not under C:\ProgramData.
TextDone
